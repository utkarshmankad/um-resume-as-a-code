name: Build Resume

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the single latest PDF after reviewing the resume
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: resume-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned compiler and validation tools
        run: |
          curl --fail --location --retry 3 'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz' -o "$RUNNER_TEMP/tectonic.tar.gz"
          echo "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/resume-tools"
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/resume-tools"
          echo "$RUNNER_TEMP/resume-tools" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/resume-python"
          "$RUNNER_TEMP/resume-python/bin/pip" install pypdf==6.10.0
          echo "PYTHON=$RUNNER_TEMP/resume-python/bin/python" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Build and validate
        run: bash scripts/build.sh
      - name: Render review pages
        run: pdftoppm -scale-to 1600 -png build/Utkarsh-Mankad-Resume.pdf build/page
      - name: Upload review bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resume-review
          path: |
            build/Utkarsh-Mankad-Resume.pdf
            build/resume.txt
            build/page-*.png
          if-no-files-found: error
          retention-days: 1
      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-log
          path: build/main.log
          retention-days: 1

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resume-review
          path: build
      - name: Publish only the reviewed main revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          test "$current" = "$BUILD_SHA" || { echo 'main moved; rebuild before publishing'; exit 1; }
          if gh release view latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$BUILD_SHA" -F force=true
            gh release edit latest --title 'Current Resume' --notes "Built from $BUILD_SHA" --latest
          else
            gh release create latest --target "$BUILD_SHA" --title 'Current Resume' --notes "Built from $BUILD_SHA" --latest
          fi
          gh release upload latest build/Utkarsh-Mankad-Resume.pdf --clobber

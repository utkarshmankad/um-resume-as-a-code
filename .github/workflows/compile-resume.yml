name: Build and Release Resume

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Triggers on tags starting with 'v' (e.g., v1.0, v2026-04-07)
  workflow_dispatch:

permissions:
  contents: write # Required to create a Release and upload the PDF

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex # Change this to your filename (e.g., EM_Role.tex)
          # compiler: xelatex # Uncomment if using specific local fonts

      - name: Upload Artifact (Internal)
        uses: actions/upload-artifact@v4
        with:
          name: Resume-Build
          path: main.pdf

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: main.pdf
          body: "Automated build of resume for tag ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
